[project]
name = "ab"
version = "0.1.0"
description = "Local, free-model audiobook narration pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9", "misaki[en,zh]>=0.9", "torch>=2.7"]
# chatterbox-tts pins torch==2.6 (no Blackwell support); it runs in its own venv
# via the subprocess backend (milestone 4). See DESIGN.md.
verify = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ab = "ab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ab"]

[tool.uv]
# Blackwell (RTX 50xx) needs the CUDA 12.8 torch wheels.
index = [{ name = "pytorch-cu128", url = "https://download.pytorch.org/whl/cu128", explicit = true }]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/ab/cli.py" = ["B008"]  # typer.Argument/Option defaults are the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
